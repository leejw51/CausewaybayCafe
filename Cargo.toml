[workspace]
members = ["crates/shared", "crates/server", "crates/web"]
default-members = ["crates/server", "crates/shared"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cafe-shared = { path = "crates/shared" }
[profile.release]
opt-level = "s"
lto = "thin"
